name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-contracts-and-package:
    runs-on: [self-hosted, Linux, X64, skills-desktop]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npm run verify
      - name: Run packaged Electron smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run package:linux

          repository_root="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"
          runner_temp="${RUNNER_TEMP:?RUNNER_TEMP is required}"
          executable_path="$(realpath "$repository_root/apps/desktop/out/Skills Desktop-linux-x64/skills-desktop")"
          profile_path="$(mktemp "$runner_temp/skills-desktop-apparmor.XXXXXX")"
          profile_loaded=0

          cleanup() {
            local cleanup_status="$1"
            trap - EXIT INT TERM
            if [[ "$profile_loaded" == 1 ]] && ! sudo apparmor_parser --skip-cache --remove "$profile_path"; then
              echo "::error::Temporary AppArmor profile cleanup failed." >&2
              cleanup_status=1
            fi
            if ! rm -f "$profile_path"; then
              echo "::error::Temporary AppArmor profile file cleanup failed." >&2
              cleanup_status=1
            fi
            exit "$cleanup_status"
          }
          trap 'cleanup "$?"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # Ubuntu 24.04 requires an executable-scoped userns profile for Chromium's sandbox.
          cat >"$profile_path" <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile skills-desktop-ci "$executable_path" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser --skip-cache --replace "$profile_path"
          profile_loaded=1

          CI=true xvfb-run -a node tests/packaged-electron.smoke.mjs
      - if: github.event_name == 'push'
        run: npm run smoke:cli

  platform-contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:imports
      - run: npm test
