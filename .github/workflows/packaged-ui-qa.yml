name: Packaged UI QA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: packaged-ui-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packaged-ui-qa:
    name: Packaged UI QA ${{ matrix.platform }} ${{ matrix.architecture }}
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            platform: linux
            runner: '"ubuntu-24.04"'
          - architecture: arm64
            platform: darwin
            runner: '"macos-15"'
          - architecture: x64
            platform: darwin
            runner: '"macos-15-intel"'
          - architecture: x64
            platform: win32
            runner: '"windows-2025"'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - name: Package unsigned ${{ matrix.platform }} ${{ matrix.architecture }}
        run: >-
          npm run build &&
          npm exec --workspace @skills-desktop/desktop electron-forge package --
          --platform=${{ matrix.platform }}
          --arch=${{ matrix.architecture }}
      - name: Run isolated Local-only UI QA
        env:
          SKILLS_DESKTOP_QA_ARCH: ${{ matrix.architecture }}
          SKILLS_DESKTOP_QA_ARTIFACTS: ${{ runner.temp }}/packaged-ui-qa
        shell: bash
        run: |
          set -euo pipefail
          profile_path=""
          profile_loaded=0

          cleanup() {
            local cleanup_status="$1"
            trap - EXIT INT TERM
            if [[ "$profile_loaded" == 1 ]] && ! sudo apparmor_parser --skip-cache --remove "$profile_path"; then
              echo "::error::Temporary AppArmor profile cleanup failed." >&2
              cleanup_status=1
            fi
            if [[ -n "$profile_path" ]] && ! rm -f "$profile_path"; then
              echo "::error::Temporary AppArmor profile file cleanup failed." >&2
              cleanup_status=1
            fi
            exit "$cleanup_status"
          }
          trap 'cleanup "$?"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          case "${{ matrix.platform }}" in
            linux)
              executable="$GITHUB_WORKSPACE/apps/desktop/out/Skills Desktop-linux-${{ matrix.architecture }}/skills-desktop"
              ;;
            darwin)
              executable="$GITHUB_WORKSPACE/apps/desktop/out/Skills Desktop-darwin-${{ matrix.architecture }}/Skills Desktop.app/Contents/MacOS/skills-desktop"
              ;;
            win32)
              executable="$GITHUB_WORKSPACE/apps/desktop/out/Skills Desktop-win32-${{ matrix.architecture }}/skills-desktop.exe"
              ;;
          esac
          export SKILLS_DESKTOP_PACKAGED_EXECUTABLE="$(node -e "console.log(require('node:fs').realpathSync(process.argv[1]))" "$executable")"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            runner_temp="${RUNNER_TEMP:?RUNNER_TEMP is required}"
            profile_path="$(mktemp "$runner_temp/skills-desktop-ui-qa-apparmor.XXXXXX")"

            # Ubuntu 24.04 requires an executable-scoped userns profile for Chromium's sandbox.
            cat >"$profile_path" <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile skills-desktop-ui-qa "$SKILLS_DESKTOP_PACKAGED_EXECUTABLE" flags=(unconfined) {
            userns,
          }
          EOF
            if sudo apparmor_parser --skip-cache --replace "$profile_path"; then
              profile_loaded=1
            else
              exit 1
            fi
            xvfb-run -a node tests/packaged-ui-qa/run.mjs
          else
            node tests/packaged-ui-qa/run.mjs
          fi
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: ignore
          name: packaged-ui-qa-${{ matrix.platform }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/packaged-ui-qa/failure.json
