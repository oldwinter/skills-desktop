name: Website

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "packages/skills-runtime/src/**"
      - "docs/images/user-guide/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "apps/website/**"
      - "packages/skills-runtime/src/**"
      - "docs/images/user-guide/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - name: Build the landing page for GitHub Pages
        # Project Pages are served under /<repository-name>/, so assets need that base path.
        run: WEBSITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build --workspace @skills-desktop/website
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/website/dist

  deploy:
    # Only the default branch publishes; pull requests stop after the build proves the page compiles.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          # Create the Pages site on first deploy instead of failing until
          # someone enables Pages by hand in repository settings.
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
